<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="H3-title H3-desc">
  <title id="H3-title">Polyadic — Three equal facets P, gradient</title>
  <desc id="H3-desc">Three branches join alternating hexagon vertices to the exact center. Three congruent rhombic faces have 120-degree rotational symmetry. A shorter, parallel vertical stroke sits on the left and shares the vertical center of the main stem. Blue, violet and rose form one continuous diagonal gradient across the mark.</desc>
  <defs>
    <linearGradient id="polyadic-h3-gradient" gradientUnits="userSpaceOnUse" x1="40" y1="27" x2="192" y2="224">
      <stop offset="0" stop-color="#2642d5"/>
      <stop offset="0.55" stop-color="#7541b3"/>
      <stop offset="1" stop-color="#bb396d"/>
    </linearGradient>
  </defs>
  <g stroke="url(#polyadic-h3-gradient)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path id="left-stroke" d="M 39.91412 84 V 204"/>
    <path id="stem" d="M 63.91412 224 V 64"/>
    <path id="hex-bowl" d="M 128 27 L 192.08588 64 L 192.08588 138 L 128 175 L 63.91412 138 L 63.91412 64 Z"/>
    <path id="three-equal-facets" d="M 128 27 V 101 M 128 101 L 192.08588 138 M 128 101 L 63.91412 138"/>
  </g>
</svg>